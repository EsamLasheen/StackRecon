name: Weekly Scan

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

# Keep scan publications in order, including manual recovery runs.
concurrency:
  group: weekly-scan
  cancel-in-progress: false

permissions:
  contents: read

env:
  SHARD_COUNT: "16"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r scanner/requirements.txt
      - name: Freeze all programs
        run: python3 -m scanner.shards prepare --index scan-index.json
      - id: matrix
        run: |
          python3 - <<'PYTHON'
          import json, os
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("shards=" + json.dumps(list(range(int(os.environ["SHARD_COUNT"])))))
              f.write("\n")
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: scan-index
          path: scan-index.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  scan:
    name: Scan shard ${{ matrix.shard }}
    needs: prepare
    runs-on: ubuntu-latest
    # Strict phase limits total at most 300 minutes, leaving setup/cleanup time.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r scanner/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: scan-index
      - name: Install httpx binary
        run: |
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Install nuclei
        run: |
          go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Download nuclei templates
        run: |
          # Full emadshanab pipeline:
          #   1. Clone all community repos (bulk_clone_repos.py)
          #   2. Clone official PD templates as source of truth
          #   3. Deduplicate + categorize (remove_duplicated_templates.py)

          git clone --depth=1 https://github.com/emadshanab/Nuclei-Templates-Collection \
            /tmp/nuclei-collection
          cd /tmp/nuclei-collection

          # Step 1: Clone all community template repos (--depth=1 for speed)
          # PD official templates are already in emadshanab's list —
          # the script clones them to community-templates/projectdiscovery__nuclei-templates
          # which is exactly what remove_duplicated_templates.py expects as source of truth.
          # Patch: --depth=1 for speed, ignore clone failures (private/deleted repos)
          sed -i 's/"git", "clone", url/"git", "clone", "--depth=1", url/' bulk_clone_repos.py
          sed -i 's/subprocess.run(\[/subprocess.run([/;s/\], capture_output=False)/])/' bulk_clone_repos.py
          python3 bulk_clone_repos.py || true

          # Step 2: Remove duplicates + categorize into clean directories
          python3 remove_duplicated_templates.py

          echo "Categorized templates: $(find categorized_templates -name '*.yaml' | wc -l)"
          echo "Categories: $(ls categorized_templates | tr '\n' ', ')"

      - name: Run scanner
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          httpx -version
          nuclei -version
          free -m
          df -h /
          vmstat 60 &
          MONITOR_PID=$!
          trap 'kill "$MONITOR_PID" 2>/dev/null || true' EXIT
          /usr/bin/time -v python3 -u -m scanner.main \
            --program-index scan-index.json \
            --shard-index "$SHARD_INDEX" --shard-count "$SHARD_COUNT" --strict \
            --workers 75 --connect-timeout 1 --read-timeout 3 \
            --output results/data.json \
            --templates /tmp/nuclei-collection/categorized_templates \
            --progress results/progress.json
      - name: Save completed shard
        uses: actions/upload-artifact@v4
        with:
          name: scan-shard-${{ matrix.shard }}
          path: results/data-full.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    needs: [prepare, scan]
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r scanner/requirements.txt
      - uses: actions/download-artifact@v4
        if: ${{ needs.scan.result == 'success' }}
        with:
          name: scan-index
      - uses: actions/download-artifact@v4
        if: ${{ needs.scan.result == 'success' }}
        with:
          pattern: scan-shard-*
          path: shards
      - name: Validate and merge every shard
        id: merge
        if: ${{ needs.scan.result == 'success' }}
        run: |
          python3 -m scanner.shards merge \
            --index scan-index.json --count "$SHARD_COUNT" --directory shards \
            --output docs/data/data.json --progress docs/data/progress.json
      - name: Upload full report
        id: full_report
        if: ${{ steps.merge.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: stackrecon-full-report-${{ github.run_id }}
          path: docs/data/data-full.json
          retention-days: 90
          if-no-files-found: error
          overwrite: true
      - name: Preserve last complete data on failure
        if: ${{ failure() || needs.scan.result != 'success' }}
        run: |
          git restore docs/data/data.json
          python3 - <<'PYTHON'
          import json, datetime
          from pathlib import Path
          path = Path("docs/data/progress.json")
          progress = json.loads(path.read_text()) if path.exists() else {}
          progress.update(status="error", phase="failed",
                          phase_label="Scan incomplete; last complete results retained",
                          updated_at=datetime.datetime.now(datetime.timezone.utc).isoformat())
          path.write_text(json.dumps(progress, indent=2))
          PYTHON
      - name: Commit scan status and validated data
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          MERGE_RESULT: ${{ steps.merge.outcome }}
          REPORT_RESULT: ${{ steps.full_report.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/progress.json
          if [ "$MERGE_RESULT" = success ] && [ "$REPORT_RESULT" = success ]; then
            git add docs/data/data.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "data: weekly scan status [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
